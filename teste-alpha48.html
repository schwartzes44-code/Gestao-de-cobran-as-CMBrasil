<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMBrasil — Teste isolado Alpha 4.8</title><style>body{font:15px system-ui;background:#f3f5f8;color:#1d2939;margin:0}main{max-width:1050px;margin:24px auto;padding:16px}h1{font-size:23px}header,.panel,.client{background:white;border-radius:12px;padding:18px;margin:12px 0;box-shadow:0 1px 4px #0001}.warning{background:#fff5db;padding:12px;border-radius:8px}select,input{padding:10px;margin:5px;max-width:100%;border:1px solid #ccd2db;border-radius:8px}.client h3{margin:0 0 8px}.muted{color:#667085}details{margin-top:8px}button{padding:10px;border:0;border-radius:8px;background:#133e63;color:white;cursor:pointer}.stat{font-weight:bold}#status{margin-top:12px}</style></head><body><main><header><h1>CMBrasil — Laboratório Alpha 4.8</h1><p class="warning"><b>Modo seguro:</b> este arquivo NÃO se conecta ao Supabase, não envia dados ao servidor e não grava alterações. A biblioteca PDF.js é carregada da internet; abra o arquivo com conexão ativa.</p><label>Selecione o PDF Carteira por Agente <input type="file" id="pdf" accept="application/pdf"></label><div id="status" aria-live="polite">Aguardando PDF.</div></header><section class="panel" id="filters" hidden><label>Cidade <select id="city"></select></label><label>Bairro <select id="area"></select></label><label>Busca <input id="search" placeholder="Cliente ou código"></label><div id="stats" class="stat"></div></section><section id="results"></section></main><script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.min.js"></script><script>
const $=id=>document.getElementById(id);let clients=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&#39;':'&#39;'}[c]||'&#39;'));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();
function parse(text){const parts=text.split(/(?=Cliente:\s*\d+\s*-\s*)/g);return parts.filter(p=>/^Cliente:\s*\d+\s*-\s*/.test(p)).map(block=>{const h=block.match(/^Cliente:\s*(\d+)\s*-\s*([\s\S]*?)\s+CPF:\s*([\d.\-]+)/);if(!h)return null;const address=(block.match(/\bEndereco:\s*([\s\S]*?)\s+Bairro:\s*([\s\S]*?)\s+Cidade:\s*([\s\S]*?)\s+CEP:\s*([\d-]+)/i)||[]);const section=(block.match(/Avalistas\s+Nome\s+Fone\(s\)([\s\S]*?)(?=\s+Parcela\s+Vencto|\s+Totais Contrato|$)/i)||[])[1]||'';const g=[];const re=/(\d{3}\.\d{3}\.\d{3}-\d{2})\s+([^\n]*?)\s+(\(?\d{2}\)?[-\s]?\d{4,5}[-\s]?\d{4})\s+(https:\/\/wa\.me\/\d+)/gi;const matches=[...section.matchAll(re)];for(let i=0;i<matches.length;i++){const m=matches[i],tail=section.slice(m.index+m[0].length,i+1<matches.length?matches[i+1].index:section.length);const line=(tail.match(/Endere[cç]o:\s*([^\n]*)/i)||[])[1]||'';const a=line.match(/^(.+?)\s+-\s+(\d{5}-?\d{3})\s+-\s+Bairro\s+(.+?)\s+-\s+(.+?)(?:\s+ERP Partner|$)/i);g.push({name:m[2].trim(),cpf:m[1],phone:m[3],address:a?{street:a[1].trim(),cep:a[2],bairro:a[3].trim(),city:a[4].trim()}:null});}return {code:h[1],name:h[2].replace(/\s+/g,' ').trim(),street:(address[1]||'').trim(),bairro:(address[2]||'').trim(),city:(address[3]||'').trim(),cep:address[4]||'',guarantors:g};}).filter(Boolean)}
function opts(el,values,all){const prior=el.value;el.innerHTML='<option value="">'+all+'</option>'+values.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');if(values.includes(prior))el.value=prior}
function render(){const cities=[...new Set(clients.map(c=>c.city).filter(Boolean))].sort();opts($('city'),cities,'Todas as cidades');const areas=[...new Set(clients.filter(c=>!$('city').value||norm(c.city)===norm($('city').value)).map(c=>c.bairro).filter(Boolean))].sort();opts($('area'),areas,'Todos os bairros');const search=norm($('search').value);const rows=clients.filter(c=>(!$('city').value||norm(c.city)===norm($('city').value))&&(!$('area').value||norm(c.bairro)===norm($('area').value))&&(!search||norm(c.name+' '+c.code).includes(search)));$('stats').textContent=rows.length+' clientes exibidos de '+clients.length+' encontrados';$('results').innerHTML=rows.map(c=>'<article class="client"><h3>'+esc(c.name)+'</h3><div class="muted">Código '+esc(c.code)+'</div><p><b>Cliente:</b> '+esc([c.street,c.bairro,c.city,c.cep].filter(Boolean).join(' • '))+'</p><details><summary>'+c.guarantors.length+' avalista(s)</summary>'+c.guarantors.map(g=>'<p><b>'+esc(g.name)+'</b> — '+esc(g.phone)+'<br>'+esc(g.address?[g.address.street,g.address.bairro,g.address.city,g.address.cep].join(' • '):'Endereço não localizado')+'</p>').join('')+'</details></article>').join('')||'<p>Nenhum cliente para os filtros selecionados.</p>'}
$('city').onchange=()=>{$('area').value='';render()};$('area').onchange=render;$('search').oninput=render;
$('pdf').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('status').textContent='Lendo PDF localmente...';try{if(!window.pdfjsLib)throw Error('PDF.js não carregou. Verifique sua conexão.');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let text='';for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i),content=await page.getTextContent();let lastY=null;for(const item of content.items){const y=item.transform?.[5];if(lastY!==null&&Math.abs(y-lastY)>2)text+='\n';text+=item.str+' ';lastY=y}text+='\n'}clients=parse(text);$('filters').hidden=false;$('city').value='';$('area').value='';$('search').value='';render();$('status').textContent='Leitura concluída: '+clients.length+' clientes. Nenhum dado foi enviado ou gravado.'}catch(err){$('status').textContent='Falha na leitura: '+err.message}};
</script></body></html>
